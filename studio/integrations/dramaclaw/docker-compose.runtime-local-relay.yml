services:
  api:
    image: dramaclaw-local/api:2.0.4-verify-h3-alias
    environment:
      MEDIA_RELAY_PROVIDER: local
      MEDIA_RELAY_LOCAL_DIR: /data/output/local/media-relay
      MEDIA_RELAY_PUBLIC_BASE_URL: "${MEDIA_RELAY_PUBLIC_BASE_URL}"
      MEDIA_RELAY_SIGNING_SECRET: "${MEDIA_RELAY_SIGNING_SECRET}"
      MEDIA_RELAY_TTL_SECONDS: "900"
      # The canvas fan-out supports 1/2/4 submissions.  Keep admission and
      # inline execution at eight video jobs so concurrent batches are not
      # rejected by the local task backend; the upstream provider/account
      # remains the final capacity boundary.
      ST_PROJECT_MAX_ACTIVE_VIDEO_TASKS: "8"
      ST_PROJECT_USER_MAX_ACTIVE_VIDEO_TASKS: "8"
      ST_CE_GLOBAL_MAX_ACTIVE_VIDEO_TASKS: "8"
      ST_CE_GLOBAL_MAX_QUEUED_VIDEO_TASKS: "128"
