# Local deployment override for the published-image stack.
# The API keeps state/config in ce-data but stores generated and uploaded media
# on a host directory (or NAS path supplied by DRAMACLAW_OUTPUT_HOST).
services:
  api:
    volumes:
      - type: volume
        source: ce-data
        target: /data
      - type: bind
        source: ${DRAMACLAW_OUTPUT_HOST:-E:/dramaclaw-storage/output}
        target: /data/output
      - type: volume
        source: newapi-data
        target: /newapi-data

volumes:
  ce-data: {}
  newapi-data: {}
